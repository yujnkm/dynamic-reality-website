# site properties and page defaults
title: Dynamic Reality Lab
# logo already contains the name; do not repeat it as text in the header
show-title: false
subtitle: 
description: The Dynamic Reality Lab (DRL) at the University of Nebraska–Lincoln explores how to enhance human interaction in the physical world through spatial computing and wide-area augmented reality.
proofer: false

# site social media and other links
links:
  email: dynamicrealitylab@gmail.com
  orcid: 0000-0003-0903-8999
  google-scholar: U6_SdvMAAAAJ
  github: yujnkm
  twitter: yujnkm
  # quoted: a bare value starting with @ is reserved in YAML
  youtube: "@yujnkm"

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: false
  # generate page for each post
  posts:
    output: false

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
